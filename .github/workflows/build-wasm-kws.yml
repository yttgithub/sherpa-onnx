name: Build WASM KWS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          free -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake python3 python3-pip wget

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.53

      - name: Download and prepare model
        run: |
          cd wasm/kws/assets
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20.tar.bz2
          tar xf sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20.tar.bz2
          MODEL=sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20
          # 【修复点1】：加上了缺失的 MODEL 变量名，防止找不到路径报错
          cp $MODEL/encoder-epoch-13-avg-2-chunk-16-left-64.int8.onnx encoder-epoch-12-avg-2-chunk-16-left-64.onnx
          cp $MODEL/decoder-epoch-13-avg-2-chunk-16-left-64.onnx      decoder-epoch-12-avg-2-chunk-16-left-64.onnx
          cp $MODEL/joiner-epoch-13-avg-2-chunk-16-left-64.int8.onnx  joiner-epoch-12-avg-2-chunk-16-left-64.onnx
          cp $MODEL/tokens.txt ./
          cp $MODEL/en.phone   ./
          rm -rf $MODEL

      - name: Patch build script
        run: |
          # 降低编译并发数，防止 Github Action 内存不足被 Kill
          sed -i 's/make -j8/make -j2/' build-wasm-simd-kws.sh
          
          # 【修复点2】：全局批量降级 onnxruntime 版本，解决因为版本过高导致的 C++ 编译报错
          find cmake -name "*.cmake" -exec sed -i 's/1.24.4/1.17.1/g' {} +
          sed -i 's/1.24.4/1.17.1/g' build-wasm-simd-kws.sh

      - name: Build WASM
        run: |
          ./build-wasm-simd-kws.sh

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-kws-dist
          path: |
            build-wasm-simd-kws/install/bin/wasm/kws/sherpa-onnx-kws.js
            build-wasm-simd-kws/install/bin/wasm/kws/sherpa-onnx-wasm-kws-main.js
            build-wasm-simd-kws/install/bin/wasm/kws/sherpa-onnx-wasm-kws-main.wasm
            build-wasm-simd-kws/install/bin/wasm/kws/sherpa-onnx-wasm-kws-main.data
          retention-days: 7
