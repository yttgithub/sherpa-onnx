name: Build WASM KWS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          free -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake python3 python3-pip wget

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      - name: Download and prepare model
        run: |
          cd wasm/kws/assets
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20.tar.bz2
          tar xf sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20.tar.bz2
          MODEL=sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20
          cp ${MODEL}/encoder-epoch-13-avg-2-chunk-16-left-64.int8.onnx encoder-epoch-12-avg-2-chunk-16-left-64.onnx
          cp ${MODEL}/decoder-epoch-13-avg-2-chunk-16-left-64.onnx      decoder-epoch-12-avg-2-chunk-16-left-64.onnx
          cp ${MODEL}/joiner-epoch-13-avg-2-chunk-16-left-64.int8.onnx  joiner-epoch-12-avg-2-chunk-16-left-64.onnx
          cp ${MODEL}/tokens.txt ./
          cp ${MODEL}/en.phone   ./
          rm -rf ${MODEL}

      - name: Patch build script
        run: |
          # 降低并行数
          sed -i 's/make -j8/make -j2/' build-wasm-simd-kws.sh

          # 用 python 精确替换，只改 cmake 命令最后的 ..，不误伤其他地方
          python3 << 'EOF'
          with open('build-wasm-simd-kws.sh', 'r') as f:
              content = f.read()
          old = '-DSHERPA_ONNX_LINK_LIBSTDCPP_STATICALLY=OFF \\\n  ..'
          new = '-DSHERPA_ONNX_LINK_LIBSTDCPP_STATICALLY=OFF \\\n  -DCMAKE_EXE_LINKER_FLAGS="-lc++fs" \\\n  ..'
          if old in content:
              content = content.replace(old, new)
              print("Patch applied successfully")
          else:
              print("WARNING: Pattern not found, skipping patch")
          with open('build-wasm-simd-kws.sh', 'w') as f:
              f.write(content)
          EOF

      - name: Build WASM
        run: |
          ./build-wasm-simd-kws.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-kws-dist
          path: |
            build-wasm-simd-kws/install/bin/wasm/kws/sherpa-onnx-kws.js
            build-wasm-simd-kws/install/bin/wasm/kws/sherpa-onnx-wasm-kws-main.js
            build-wasm-simd-kws/install/bin/wasm/kws/sherpa-onnx-wasm-kws-main.wasm
            build-wasm-simd-kws/install/bin/wasm/kws/sherpa-onnx-wasm-kws-main.data
          retention-days: 7
