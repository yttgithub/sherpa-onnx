name: build-sherpa-onnx-wasm-kws-latest

on:
  workflow_dispatch:

jobs:
  build-kws-wasm:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout sherpa-onnx
        uses: actions/checkout@v4
        with:
          repository: k2-fsa/sherpa-onnx
          ref: v1.12.20
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            curl \
            wget \
            tar \
            xz-utils

      - name: Setup emsdk 3.1.53
        shell: bash
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 3.1.53
          ./emsdk activate 3.1.53

      - name: Prepare zh-en KWS assets
        shell: bash
        run: |
          cd wasm/kws/assets
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20.tar.bz2
          tar xf sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20.tar.bz2
          mv sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20/encoder-epoch-13-avg-2-chunk-16-left-64.onnx ./
          mv sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20/decoder-epoch-13-avg-2-chunk-16-left-64.onnx ./
          mv sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20/joiner-epoch-13-avg-2-chunk-16-left-64.onnx ./
          mv sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20/tokens.txt ./
          cp sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20/test_wavs/keywords.txt ./
          rm -rf sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20
          rm -f sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20.tar.bz2

      - name: Build KWS wasm
        shell: bash
        run: |
          source emsdk/emsdk_env.sh
          chmod +x ./build-wasm-simd-kws.sh
          ./build-wasm-simd-kws.sh

      - name: Upload wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-wasm-kws-latest
          path: build-wasm-simd-kws/install/bin/wasm/
