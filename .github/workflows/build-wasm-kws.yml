name: build-sherpa-onnx-wasm-kws-2025-mixed-int8

on:
  workflow_dispatch:

jobs:
  build-kws-wasm:
    runs-on: ubuntu-22.04

    env:
      SHERPA_TAG: v1.12.13
      EMSDK_VERSION: 3.1.53
      MODEL_PACKAGE: sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20

    steps:
      - name: Checkout sherpa-onnx
        uses: actions/checkout@v4
        with:
          repository: k2-fsa/sherpa-onnx
          ref: ${{ env.SHERPA_TAG }}
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            curl \
            wget \
            tar \
            xz-utils

      - name: Setup emsdk
        shell: bash
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install "${EMSDK_VERSION}"
          ./emsdk activate "${EMSDK_VERSION}"

      - name: Show emsdk version
        shell: bash
        run: |
          source emsdk/emsdk_env.sh
          emcc -v

      - name: Verify CMakeLists before patch
        shell: bash
        run: |
          echo "=== BEFORE PATCH ==="
          grep -n 'INITIAL_MEMORY\|ALLOW_MEMORY_GROWTH\|MAXIMUM_MEMORY\|FORCE_FILESYSTEM' wasm/kws/CMakeLists.txt || true
          sed -n '1,80p' wasm/kws/CMakeLists.txt

      - name: Patch wasm memory settings
        shell: bash
        run: |
          set -eux

          python3 - <<'PY'
          from pathlib import Path

          p = Path("wasm/kws/CMakeLists.txt")
          text = p.read_text(encoding="utf-8")

          old = 'set(MY_FLAGS "-s FORCE_FILESYSTEM=1 -s INITIAL_MEMORY=512MB -s ALLOW_MEMORY_GROWTH=1")'
          new = 'set(MY_FLAGS "-s FORCE_FILESYSTEM=1 -s INITIAL_MEMORY=128MB -s ALLOW_MEMORY_GROWTH=1 -s MAXIMUM_MEMORY=512MB")'

          if old not in text:
              raise SystemExit("Did not find the expected original MY_FLAGS line in wasm/kws/CMakeLists.txt")

          text = text.replace(old, new, 1)
          p.write_text(text, encoding="utf-8")
          print("Patched MY_FLAGS successfully.")
          PY

      - name: Verify CMakeLists after patch
        shell: bash
        run: |
          echo "=== AFTER PATCH ==="
          grep -n 'INITIAL_MEMORY\|ALLOW_MEMORY_GROWTH\|MAXIMUM_MEMORY\|FORCE_FILESYSTEM' wasm/kws/CMakeLists.txt || true
          sed -n '1,80p' wasm/kws/CMakeLists.txt

          grep -q 'INITIAL_MEMORY=128MB' wasm/kws/CMakeLists.txt
          grep -q 'ALLOW_MEMORY_GROWTH=1' wasm/kws/CMakeLists.txt
          grep -q 'MAXIMUM_MEMORY=512MB' wasm/kws/CMakeLists.txt

          echo "Memory settings verified."

      - name: Patch wasm/kws to use 2025 mixed int8 names
        shell: bash
        run: |
          set -eux

          # CMake 里只检查 decoder 是否存在，所以这里改成 2025 的 fp32 decoder
          sed -i 's/decoder-epoch-12-avg-2-chunk-16-left-64.onnx/decoder-epoch-13-avg-2-chunk-16-left-64.onnx/g' wasm/kws/CMakeLists.txt

          for file in wasm/kws/app.js wasm/kws/sherpa-onnx-kws.js; do
            if [ -f "$file" ]; then
              # 2025 官方推荐：encoder=int8, decoder=fp32, joiner=int8
              sed -i 's/encoder-epoch-12-avg-2-chunk-16-left-64.onnx/encoder-epoch-13-avg-2-chunk-16-left-64.int8.onnx/g' "$file"
              sed -i 's/decoder-epoch-12-avg-2-chunk-16-left-64.onnx/decoder-epoch-13-avg-2-chunk-16-left-64.onnx/g' "$file"
              sed -i 's/joiner-epoch-12-avg-2-chunk-16-left-64.onnx/joiner-epoch-13-avg-2-chunk-16-left-64.int8.onnx/g' "$file"

              sed -i 's/encoder-epoch-20-avg-2-chunk-16-left-128.onnx/encoder-epoch-13-avg-2-chunk-16-left-64.int8.onnx/g' "$file"
              sed -i 's/decoder-epoch-20-avg-2-chunk-16-left-128.onnx/decoder-epoch-13-avg-2-chunk-16-left-64.onnx/g' "$file"
              sed -i 's/joiner-epoch-20-avg-2-chunk-16-left-128.onnx/joiner-epoch-13-avg-2-chunk-16-left-64.int8.onnx/g' "$file"
            fi
          done

          echo "=== model references after patch ==="
          grep -R -n 'epoch-12\|epoch-13\|epoch-20\|int8' wasm/kws || true

      - name: Prepare 2025 KWS assets
        shell: bash
        run: |
          set -eux
          cd wasm/kws/assets

          rm -f README.md

          wget -q "https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/${MODEL_PACKAGE}.tar.bz2"
          tar xf "${MODEL_PACKAGE}.tar.bz2"

          # 官方 2025 组合：encoder=int8, decoder=fp32, joiner=int8
          cp "${MODEL_PACKAGE}/encoder-epoch-13-avg-2-chunk-16-left-64.int8.onnx" ./
          cp "${MODEL_PACKAGE}/decoder-epoch-13-avg-2-chunk-16-left-64.onnx" ./
          cp "${MODEL_PACKAGE}/joiner-epoch-13-avg-2-chunk-16-left-64.int8.onnx" ./
          cp "${MODEL_PACKAGE}/tokens.txt" ./
          cp "${MODEL_PACKAGE}/test_wavs/keywords.txt" ./keywords.txt

          rm -rf "${MODEL_PACKAGE}"
          rm -f "${MODEL_PACKAGE}.tar.bz2"

          echo "=== assets directory after cleanup ==="
          ls -lh

      - name: Check required files
        shell: bash
        run: |
          test -f wasm/kws/assets/encoder-epoch-13-avg-2-chunk-16-left-64.int8.onnx
          test -f wasm/kws/assets/decoder-epoch-13-avg-2-chunk-16-left-64.onnx
          test -f wasm/kws/assets/joiner-epoch-13-avg-2-chunk-16-left-64.int8.onnx
          test -f wasm/kws/assets/tokens.txt
          test -f wasm/kws/assets/keywords.txt

      - name: Show assets directory size
        shell: bash
        run: |
          du -sh wasm/kws/assets
          find wasm/kws/assets -maxdepth 1 -type f | sort
          find wasm/kws/assets -maxdepth 1 -type d | sort

      - name: Build KWS wasm
        shell: bash
        run: |
          source emsdk/emsdk_env.sh
          chmod +x ./build-wasm-simd-kws.sh
          ./build-wasm-simd-kws.sh

      - name: Print model references in build output
        shell: bash
        run: |
          echo "=== source references ==="
          grep -R -n 'epoch-12\|epoch-13\|epoch-20\|int8' wasm/kws || true

          echo "=== built output references ==="
          grep -R -n 'epoch-12\|epoch-13\|epoch-20\|int8' build-wasm-simd-kws || true

      - name: Show wasm output files
        shell: bash
        run: |
          find build-wasm-simd-kws -maxdepth 5 -type f | sort
          ls -lh build-wasm-simd-kws/install/bin/wasm || true

      - name: Upload wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-wasm-kws-2025-mixed-int8
          path: build-wasm-simd-kws/install/bin/wasm/
